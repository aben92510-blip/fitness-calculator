<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة السعرات الحرارية - الكابتن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 500px; background: #fff; padding: 25px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; margin-top: 20px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #219653; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-right: 5px solid #27ae60; display: none; }
        .cta { text-align: center; margin-top: 15px; }
        .cta a { background: #25d366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة السعرات والماكروز</h2>

    <label for="age">العمر (سنوات):</label>
    <input type="number" id="age" placeholder="مثال: 25">

    <label for="gender">الجنس:</label>
    <select id="gender">
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
    </select>

    <label for="weight">الوزن (كغ):</label>
    <input type="number" id="weight" placeholder="مثال: 75">

    <label for="height">الطول (سم):</label>
    <input type="number" id="height" placeholder="مثال: 175">

    <label for="activity">مستوى النشاط البدني:</label>
    <select id="activity">
        <option value="1.2">خامل (لا تمارين تقريباً)</option>
        <option value="1.375">خفيف النشاط (تمارين خفيفة 1-3 أيام)</option>
        <option value="1.55">متوسط النشاط (تمارين 3-5 أيام)</option>
        <option value="1.725">نشيط جداً (تمارين مكثفة 6-7 أيام)</option>
    </select>

    <button onclick="calculateCalories()">احسب سعراتك الآن</button>

    <div id="result">
        <h3 id="caloriesText"></h3>
        <p id="goalText"></p>
        <div class="cta">
            <p>تريد برنامج تدريبي وتغذية مخصص لهدفك؟</p>
            <a href="https://wa.me/رقم_هاتفك_هنا" target="_blank">تواصل معي عبر واتساب للاشتراك</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
